events {}

http {
  upstream auth_service { server auth-service:3001; }
  upstream social_service { server social-service:3002; }
  upstream chat_service { server chat-service:3003; }
  upstream room_service { server room-service:3004; }
  upstream video_service { server video-service:3005; }
  upstream game_service { server game-service:3006; }
  upstream economy_service { server economy-service:3007; }
  upstream notification_service { server notification-service:3008; }

  server {
    listen 80;

    location /auth/ { proxy_pass http://auth_service/; }
    location /social/ { proxy_pass http://social_service/; }
    location /chat/ { proxy_pass http://chat_service/; }
    location /rooms/ { proxy_pass http://room_service/; }
    location /videos/ { proxy_pass http://video_service/; }
    location /game/ { proxy_pass http://game_service/; }
    location /economy/ { proxy_pass http://economy_service/; }
    location /notifications/ { proxy_pass http://notification_service/; }

    location /health {
      add_header Content-Type application/json;
      return 200 '{"ok":true,"gateway":"socialfarm"}';
    }
  }
}
